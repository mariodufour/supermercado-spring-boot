services:
  db:
    image: mysql:8.0
    container_name: db_supermercado
    restart: always
    environment:
      MYSQL_DATABASE: supermercado_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - db_supermercado_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: api_supermercado
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=supermercado_db
      - DB_USER=root
      - DB_PASS=root
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_supermercado_data: